  <script>
    // 讀取嵌入的餐廳資料
    const rawDataElem = document.getElementById('restaurants-data');
    let allRestaurants = [];
    try {
      allRestaurants = JSON.parse(rawDataElem.textContent.trim());
    } catch (e) {
      console.error("Failed to parse restaurants data:", e);
    }

    let currentRegion = 'all';
    let searchQuery = '';

    // 初始化地區篩選標籤
    function initFilterTabs() {
      const container = document.getElementById('filterTabsContainer');
      container.innerHTML = '';

      if (allRestaurants.length === 0) {
        container.parentElement.classList.add('hidden');
        return;
      }
      container.parentElement.classList.remove('hidden');

      // 產生 "全部" 標籤
      const allBtn = createFilterTabButton('all', `全部 (${allRestaurants.length})`, currentRegion === 'all');
      container.appendChild(allBtn);

      // 統計各大縣市與具體區域
      // 1. 縣市級 (如: 台南市, 高雄市)
      const cityCounts = {};
      // 2. 區域級 (如: 高雄市 · 鹽埕區)
      const districtCounts = {};

      allRestaurants.forEach(item => {
        const city = item.city || '其他';
        cityCounts[city] = (cityCounts[city] || 0) + 1;

        if (item.district && item.district !== '其他') {
          const distKey = `${city} · ${item.district}`;
          districtCounts[distKey] = (districtCounts[distKey] || 0) + 1;
        }
      });

      // 先輸出縣市 Pills（若有多個縣市）
      const cities = Object.keys(cityCounts).sort((a, b) => cityCounts[b] - cityCounts[a]);
      
      // 依序輸出縣市與其所屬行政區
      cities.forEach(city => {
        if (city !== '其他') {
          // 縣市大標籤（選該縣市全部）
          const cityBtn = createFilterTabButton(
            `city:${city}`, 
            `📍 ${city} (${cityCounts[city]})`, 
            currentRegion === `city:${city}`
          );
          container.appendChild(cityBtn);
        }
      });

      // 再輸出具體行政區標籤
      Object.keys(districtCounts).forEach(dist => {
        const distBtn = createFilterTabButton(
          `dist:${dist}`, 
          `${dist} (${districtCounts[dist]})`, 
          currentRegion === `dist:${dist}`
        );
        container.appendChild(distBtn);
      });
    }

    function createFilterTabButton(regionKey, label, isActive) {
      const btn = document.createElement('button');
      btn.className = `filter-tab px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all duration-150 flex items-center space-x-1.5 ${
        isActive 
          ? 'bg-orange-600 text-white shadow-sm shadow-orange-600/30 font-semibold ring-2 ring-orange-500/30' 
          : 'bg-slate-100 hover:bg-slate-200 text-slate-600'
      }`;
      btn.textContent = label;
      btn.dataset.region = regionKey;
      btn.onclick = () => {
        currentRegion = regionKey;
        initFilterTabs();
        renderCards();
      };
      return btn;
    }

    // 判斷該項目是否符合地區
    function matchesRegion(item, region) {
      if (region === 'all') return true;
      
      // 點選「縣市大標籤」：例如 city:台南市
      if (region.startsWith('city:')) {
        const targetCity = region.replace('city:', '');
        return item.city === targetCity;
      }
      
      // 點選「具體行政區」：例如 dist:高雄市 · 鹽埕區
      if (region.startsWith('dist:')) {
        const targetDist = region.replace('dist:', '');
        const currentDistKey = `${item.city} · ${item.district}`;
        return currentDistKey === targetDist;
      }

      return true;
    }

    // 判斷該項目是否符合搜尋字詞
    function matchesSearch(item, query) {
      if (!query) return true;
      const q = query.toLowerCase();
      const inName = (item.name || '').toLowerCase().includes(q);
      const inAddress = (item.address || '').toLowerCase().includes(q);
      const inCity = (item.city || '').toLowerCase().includes(q);
      const inDistrict = (item.district || '').toLowerCase().includes(q);
      const inDishes = Array.isArray(item.recommended_dishes) && item.recommended_dishes.some(d => d.toLowerCase().includes(q));
      const inNotes = (item.notes || '').toLowerCase().includes(q);
      return inName || inAddress || inCity || inDistrict || inDishes || inNotes;
    }

    // 渲染卡片
    function renderCards() {
      const grid = document.getElementById('restaurantGrid');
      const noResults = document.getElementById('noResultsState');
      const emptyInitialState = document.getElementById('emptyInitialState');
      const resultText = document.getElementById('filterResultText');
      const countBadge = document.getElementById('total-count-badge');
      
      if (countBadge) {
        countBadge.textContent = `${allRestaurants.length} 家精選`;
      }

      if (allRestaurants.length === 0) {
        if (emptyInitialState) emptyInitialState.classList.remove('hidden');
        grid.innerHTML = '';
        noResults.classList.add('hidden');
        resultText.textContent = '尚未收錄餐廳';
        return;
      } else {
        if (emptyInitialState) emptyInitialState.classList.add('hidden');
      }

      const filtered = allRestaurants.filter(item => 
        matchesRegion(item, currentRegion) && matchesSearch(item, searchQuery)
      );

      // 更新統計文字
      if (currentRegion === 'all' && !searchQuery) {
        resultText.textContent = `共 ${filtered.length} 家推薦美食`;
      } else {
        resultText.textContent = `符合條件：${filtered.length} 家`;
      }

      if (filtered.length === 0) {
        grid.innerHTML = '';
        noResults.classList.remove('hidden');
        return;
      }

      noResults.classList.add('hidden');
      grid.innerHTML = filtered.map(item => {
        const platformBadge = item.source_platform === 'threads' 
          ? `<span class="inline-flex items-center space-x-1 px-2 py-0.5 rounded-md text-[11px] font-medium bg-black text-white"><span>@</span><span>Threads</span></span>`
          : item.source_platform === 'instagram'
          ? `<span class="inline-flex items-center space-x-1 px-2 py-0.5 rounded-md text-[11px] font-medium bg-gradient-to-r from-purple-500 via-pink-500 to-amber-500 text-white"><span>IG</span></span>`
          : `<span class="inline-flex items-center space-x-1 px-2 py-0.5 rounded-md text-[11px] font-medium bg-slate-200 text-slate-700">社群推薦</span>`;

        const locationTag = (item.city && item.city !== '其他')
          ? `${item.city} · ${item.district || ''}`
          : '未標明地區';

        const dishesHtml = (item.recommended_dishes && item.recommended_dishes.length > 0)
          ? item.recommended_dishes.map(d => `<span class="inline-block bg-orange-50 text-orange-700 border border-orange-200/60 rounded-md px-2 py-0.5 text-xs font-medium cursor-pointer hover:bg-orange-100 transition-colors" onclick="setSearch('${d}')">${d}</span>`).join('')
          : `<span class="text-xs text-slate-400">貼文未列出具體餐點</span>`;

        const notesHtml = item.notes 
          ? `<div class="bg-amber-50/70 border-l-2 border-amber-400 p-2.5 rounded text-xs text-amber-900 leading-relaxed mt-3 flex items-start space-x-1.5">
               <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-600 mt-0.5 shrink-0"></i>
               <span>${item.notes}</span>
             </div>`
          : '';

        return `
          <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition-all duration-200 flex flex-col justify-between overflow-hidden group">
            
            <div class="p-5">
              <!-- Header: Platform & Region -->
              <div class="flex items-center justify-between mb-3">
                ${platformBadge}
                <div class="flex items-center text-xs font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">
                  <i data-lucide="map-pin" class="w-3 h-3 text-slate-400 mr-1"></i>
                  ${locationTag}
                </div>
              </div>

              <!-- Restaurant Name -->
              <h2 class="text-lg font-bold text-slate-900 group-hover:text-orange-600 transition-colors leading-snug">
                ${item.name}
              </h2>

              <!-- Address -->
              <p class="text-xs text-slate-500 mt-1 flex items-start space-x-1">
                <i data-lucide="navigation" class="w-3 h-3 text-slate-400 mt-0.5 shrink-0"></i>
                <span class="line-clamp-2">${item.address || '地址未詳述'}</span>
              </p>

              <!-- Price -->
              <div class="mt-3 flex items-center space-x-1.5 text-xs font-medium text-slate-600">
                <i data-lucide="wallet" class="w-3.5 h-3.5 text-slate-400"></i>
                <span>${item.price_range || '未註明（依現場菜單為準）'}</span>
              </div>

              <!-- Recommended Dishes -->
              <div class="mt-3.5">
                <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">推薦必點</div>
                <div class="flex flex-wrap gap-1.5">
                  ${dishesHtml}
                </div>
              </div>

              <!-- Notes -->
              ${notesHtml}
            </div>

            <!-- Card Action Footer -->
            <div class="p-4 bg-slate-50 border-t border-slate-100 flex items-center gap-2">
              <a 
                href="${item.google_maps_url}" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="flex-1 inline-flex items-center justify-center space-x-1.5 bg-orange-600 hover:bg-orange-700 active:bg-orange-800 text-white font-semibold text-xs py-2 px-3 rounded-xl shadow-sm transition-all duration-150"
              >
                <i data-lucide="map" class="w-3.5 h-3.5"></i>
                <span>Google Maps 打開</span>
              </a>

              <a 
                href="${item.post_url}" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="inline-flex items-center justify-center space-x-1 bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 font-medium text-xs py-2 px-3 rounded-xl transition-all duration-150"
                title="查看原文照片與貼文"
              >
                <i data-lucide="external-link" class="w-3.5 h-3.5 text-slate-400"></i>
                <span>原文</span>
              </a>
            </div>

          </div>
        `;
      }).join('');

      // 重新喚起 Lucide 圖標
      lucide.createIcons();
    }

    // 搜尋功能
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearSearchBtn');

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      if (searchQuery) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderCards();
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearBtn.classList.add('hidden');
      renderCards();
    });

    function setSearch(dishName) {
      const cleanDish = dishName.replace(/\s*\(\$\d+\)/, '');
      searchInput.value = cleanDish;
      searchQuery = cleanDish;
      clearBtn.classList.remove('hidden');
      renderCards();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetFilters() {
      searchInput.value = '';
      searchQuery = '';
      clearBtn.classList.add('hidden');
      currentRegion = 'all';
      initFilterTabs();
      renderCards();
    }

    // 初始載入
    document.addEventListener('DOMContentLoaded', () => {
      initFilterTabs();
      renderCards();
      lucide.createIcons();
    });
  </script>
</body>
</html>
